name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend CI (Spring Boot & Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: threadhub
          POSTGRES_USER: threadhub_user
          POSTGRES_PASSWORD: threadhub_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: threadhub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Backend Tests and Build Package
        env:
          DB_URL: jdbc:postgresql://localhost:5432/threadhub
          DB_USERNAME: threadhub_user
          DB_PASSWORD: threadhub_dev
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
        run: ./mvnw clean verify -B

  frontend:
    name: Frontend CI (React & Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint Checks
        run: npm run lint

      - name: Build Frontend Assets
        run: npm run build
